name: Release
# Push a tag like v0.2.5 to build the app and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag matches app version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2; exit 1
          fi
          grep -q "version = \"$version\"" Sources/LumaCore/Core.swift || { echo "Core.swift version differs from $version" >&2; exit 1; }
          test -f "docs/RELEASE-$version.md" || { echo "Missing docs/RELEASE-$version.md" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Build application
        run: ./scripts/build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/Luma.app
      - name: Checksums
        run: cd dist && shasum -a 256 Luma-macOS-arm64.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Luma-macOS-arm64.zip dist/SHA256SUMS.txt \
            --title "Luma $VERSION" \
            --notes-file "docs/RELEASE-$VERSION.md"
